name: 每日 GitHub 热门项目采集

on:
  # 每天北京时间 08:00（UTC 00:00）自动运行，推送前一天的热门项目
  schedule:
    - cron: '0 0 * * *'
  # 支持手动触发
  workflow_dispatch:
    inputs:
      date:
        description: '指定采集日期（留空则采集前一天），格式 YYYY-MM-DD'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install certifi

      - name: 执行项目采集
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python3 scripts/fetch_github.py "${{ inputs.date }}"
          else
            python3 scripts/fetch_github.py
          fi

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "🔥 每日 GitHub 热门项目更新 $(date -u '+%Y-%m-%d')"
          git push

      - name: 触发页面部署
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy_pages.yml/dispatches \
            -d '{"ref":"main"}' || true
